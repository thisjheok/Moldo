[project]
name = "ditto-api"
version = "0.1.0"
description = "FastAPI backend for Ditto speaking practice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0,<2.0.0",
  "ruff>=0.5.0,<1.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ditto_api"]
